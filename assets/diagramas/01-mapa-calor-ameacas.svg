<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" width="1300" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1300" height="900" fill="#0d1117"/>

  <!-- Título -->
  <text x="40" y="46" fill="#e6edf3" font-size="25" font-weight="bold">Mapa de Calor de Ameaças — Probabilidade × Impacto</text>
  <text x="40" y="72" fill="#8b949e" font-size="14">Posicionamento qualitativo das principais ameaças ao setor financeiro e de energia, 2025–2026</text>
  <line x1="40" y1="90" x2="1260" y2="90" stroke="#30363d" stroke-width="1"/>

  <!-- ================= GRADE 3x3 ================= -->
  <!-- Colunas (Probabilidade): Baixa [320-606.7] Média [606.7-893.3] Alta [893.3-1180] -->
  <!-- Linhas (Impacto): Alto [140-320] Médio [320-500] Baixo [500-680] -->

  <!-- Linha Impacto Alto -->
  <rect x="320" y="140" width="286.7" height="180" fill="#e3b341" fill-opacity="0.16"/>
  <rect x="606.7" y="140" width="286.6" height="180" fill="#f85149" fill-opacity="0.16"/>
  <rect x="893.3" y="140" width="286.7" height="180" fill="#f85149" fill-opacity="0.34"/>

  <!-- Linha Impacto Médio -->
  <rect x="320" y="320" width="286.7" height="180" fill="#3fb950" fill-opacity="0.14"/>
  <rect x="606.7" y="320" width="286.6" height="180" fill="#e3b341" fill-opacity="0.14"/>
  <rect x="893.3" y="320" width="286.7" height="180" fill="#f85149" fill-opacity="0.16"/>

  <!-- Linha Impacto Baixo -->
  <rect x="320" y="500" width="286.7" height="180" fill="#3fb950" fill-opacity="0.14"/>
  <rect x="606.7" y="500" width="286.6" height="180" fill="#3fb950" fill-opacity="0.14"/>
  <rect x="893.3" y="500" width="286.7" height="180" fill="#e3b341" fill-opacity="0.14"/>

  <!-- Linhas de grade -->
  <g stroke="#30363d" stroke-width="1.5" fill="none">
    <line x1="320" y1="140" x2="1180" y2="140"/>
    <line x1="320" y1="320" x2="1180" y2="320"/>
    <line x1="320" y1="500" x2="1180" y2="500"/>
    <line x1="320" y1="680" x2="1180" y2="680"/>
    <line x1="320" y1="140" x2="320" y2="680"/>
    <line x1="606.7" y1="140" x2="606.7" y2="680"/>
    <line x1="893.3" y1="140" x2="893.3" y2="680"/>
    <line x1="1180" y1="140" x2="1180" y2="680"/>
  </g>

  <!-- Destaque do quadrante crítico -->
  <rect x="893.3" y="140" width="286.7" height="180" fill="none" stroke="#f85149" stroke-width="3.5"/>
  <text x="1036.7" y="168" fill="#f85149" font-size="13.5" font-weight="bold" text-anchor="middle">◆ QUADRANTE CRÍTICO</text>
  <text x="1036.7" y="186" fill="#f85149" font-size="11" text-anchor="middle">alta probabilidade × alto impacto</text>

  <!-- ================= EIXOS ================= -->
  <!-- Rótulos de coluna (Probabilidade) -->
  <text x="463.3" y="708" fill="#c9d1d9" font-size="15" font-weight="bold" text-anchor="middle">Baixa</text>
  <text x="750" y="708" fill="#c9d1d9" font-size="15" font-weight="bold" text-anchor="middle">Média</text>
  <text x="1036.7" y="708" fill="#c9d1d9" font-size="15" font-weight="bold" text-anchor="middle">Alta</text>
  <text x="750" y="740" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle">Probabilidade →</text>

  <!-- Rótulos de linha (Impacto) -->
  <text x="300" y="235" fill="#c9d1d9" font-size="15" font-weight="bold" text-anchor="end">Alto</text>
  <text x="300" y="415" fill="#c9d1d9" font-size="15" font-weight="bold" text-anchor="end">Médio</text>
  <text x="300" y="595" fill="#c9d1d9" font-size="15" font-weight="bold" text-anchor="end">Baixo</text>
  <text x="70" y="410" fill="#e6edf3" font-size="16" font-weight="bold" text-anchor="middle" transform="rotate(-90 70 410)">Impacto ↑</text>

  <!-- ================= MARCADORES DE AMEAÇA ================= -->

  <!-- 1. Ransomware — Alta prob. / Alto impacto (quadrante crítico) -->
  <circle cx="1036.7" cy="275" r="11" fill="#f85149" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="972" y="288" width="130" height="24" rx="5" fill="#0d1117" fill-opacity="0.82" stroke="#f85149" stroke-width="1"/>
  <text x="1037" y="304" fill="#f85149" font-size="13.5" font-weight="bold" text-anchor="middle">Ransomware</text>

  <!-- 2. Phishing / Engenharia social — Alta prob. / Médio-Alto impacto -->
  <circle cx="1036.7" cy="352" r="11" fill="#e3b341" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="947" y="365" width="180" height="42" rx="5" fill="#0d1117" fill-opacity="0.82" stroke="#e3b341" stroke-width="1"/>
  <text x="1037" y="381" fill="#e3b341" font-size="13" font-weight="bold" text-anchor="middle">Phishing /</text>
  <text x="1037" y="398" fill="#e3b341" font-size="13" font-weight="bold" text-anchor="middle">Engenharia social</text>

  <!-- 3. Cadeia de suprimentos / terceiros — Média prob. / Alto impacto -->
  <circle cx="845" cy="205" r="11" fill="#a371f7" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="763" y="150" width="164" height="42" rx="5" fill="#0d1117" fill-opacity="0.82" stroke="#a371f7" stroke-width="1"/>
  <text x="845" y="167" fill="#a371f7" font-size="13" font-weight="bold" text-anchor="middle">Cadeia de</text>
  <text x="845" y="184" fill="#a371f7" font-size="13" font-weight="bold" text-anchor="middle">suprimentos</text>

  <!-- 4. Insider — Média prob. / Alto impacto -->
  <circle cx="670" cy="270" r="11" fill="#d29922" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="622" y="283" width="96" height="24" rx="5" fill="#0d1117" fill-opacity="0.82" stroke="#d29922" stroke-width="1"/>
  <text x="670" y="299" fill="#d29922" font-size="13.5" font-weight="bold" text-anchor="middle">Insider</text>

  <!-- 5. DDoS — Alta prob. / Baixo impacto -->
  <circle cx="1036.7" cy="595" r="11" fill="#58a6ff" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="990" y="608" width="94" height="24" rx="5" fill="#0d1117" fill-opacity="0.82" stroke="#58a6ff" stroke-width="1"/>
  <text x="1037" y="624" fill="#58a6ff" font-size="13.5" font-weight="bold" text-anchor="middle">DDoS</text>

  <!-- 6. Ameaça a OT/ICS — Baixa prob. / Alto impacto -->
  <circle cx="520" cy="200" r="11" fill="#f85149" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="440" y="150" width="160" height="42" rx="5" fill="#0d1117" fill-opacity="0.82" stroke="#f85149" stroke-width="1"/>
  <text x="520" y="167" fill="#f85149" font-size="13" font-weight="bold" text-anchor="middle">Ameaça a</text>
  <text x="520" y="184" fill="#f85149" font-size="13" font-weight="bold" text-anchor="middle">OT/ICS</text>

  <!-- ================= LEGENDA ================= -->
  <line x1="40" y1="770" x2="1260" y2="770" stroke="#30363d" stroke-width="1"/>
  <circle cx="60" cy="800" r="7" fill="#f85149"/>
  <text x="75" y="805" fill="#8b949e" font-size="12.5">Crítico / destrutivo</text>
  <circle cx="260" cy="800" r="7" fill="#e3b341"/>
  <text x="275" y="805" fill="#8b949e" font-size="12.5">Alerta / engenharia social</text>
  <circle cx="500" cy="800" r="7" fill="#d29922"/>
  <text x="515" y="805" fill="#8b949e" font-size="12.5">Risco interno</text>
  <circle cx="680" cy="800" r="7" fill="#a371f7"/>
  <text x="695" y="805" fill="#8b949e" font-size="12.5">Risco sistêmico / terceiros</text>
  <circle cx="940" cy="800" r="7" fill="#58a6ff"/>
  <text x="955" y="805" fill="#8b949e" font-size="12.5">Disponibilidade / infraestrutura</text>

  <text x="40" y="840" fill="#8b949e" font-size="12">Posicionamento qualitativo com base nas fontes consolidadas no capítulo 01 — Panorama Global (ver seção Fontes deste capítulo).</text>
  <text x="40" y="862" fill="#8b949e" font-size="12">Ameaça a OT/ICS: baixa frequência observada, mas impacto potencialmente físico/operacional — tratada como quase-crítica mesmo fora do quadrante vermelho.</text>
</svg>
