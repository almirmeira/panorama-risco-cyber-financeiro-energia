<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1500" height="900" fill="#0d1117"/>

  <!-- Título -->
  <text x="40" y="42" fill="#e6edf3" font-size="24" font-weight="bold">Superfície de Ataque — Pix e Open Finance</text>
  <text x="40" y="66" fill="#8b949e" font-size="13.5">Topologia lógica do fluxo de pagamento instantâneo e da camada de compartilhamento de dados entre instituições, com vetores de ataque anotados</text>
  <line x1="40" y1="82" x2="1460" y2="82" stroke="#30363d" stroke-width="1"/>

  <!-- ================= FLUXO PRINCIPAL PIX (y 150-260) ================= -->

  <!-- Box 1: Cliente pagador -->
  <rect x="40" y="150" width="230" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="155" y="178" fill="#e6edf3" font-size="14" font-weight="bold" text-anchor="middle">Cliente pagador</text>
  <text x="155" y="198" fill="#c9d1d9" font-size="11.5" text-anchor="middle">App bancário / carteira</text>
  <text x="155" y="215" fill="#c9d1d9" font-size="11.5" text-anchor="middle">digital no dispositivo</text>
  <text x="155" y="238" fill="#8b949e" font-size="10.5" text-anchor="middle">autentica e autoriza</text>
  <text x="155" y="252" fill="#8b949e" font-size="10.5" text-anchor="middle">a transação Pix</text>

  <!-- Box 2: Instituição Participante Enviadora -->
  <rect x="330" y="150" width="250" height="110" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="455" y="178" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">Instituição Participante</text>
  <text x="455" y="197" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">(Enviadora)</text>
  <text x="455" y="218" fill="#c9d1d9" font-size="11" text-anchor="middle">Banco, fintech ou instituição</text>
  <text x="455" y="234" fill="#c9d1d9" font-size="11" text-anchor="middle">de pagamento autorizada pelo BC</text>
  <text x="455" y="252" fill="#8b949e" font-size="10.5" text-anchor="middle">também participa do Open Finance ↓</text>

  <!-- Box 3: SPI + DICT — Banco Central -->
  <rect x="640" y="150" width="280" height="110" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
  <text x="780" y="178" fill="#58a6ff" font-size="15" font-weight="bold" text-anchor="middle">SPI + DICT</text>
  <text x="780" y="197" fill="#e6edf3" font-size="12" text-anchor="middle">Banco Central do Brasil</text>
  <text x="780" y="219" fill="#c9d1d9" font-size="11" text-anchor="middle">Sistema de Pagamentos Instantâneos</text>
  <text x="780" y="235" fill="#c9d1d9" font-size="11" text-anchor="middle">+ Diretório de Identificadores</text>
  <text x="780" y="252" fill="#8b949e" font-size="10.5" text-anchor="middle">liquida e roteia a mensagem Pix</text>

  <!-- Box 4: Instituição Participante Recebedora -->
  <rect x="980" y="150" width="250" height="110" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="1105" y="178" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">Instituição Participante</text>
  <text x="1105" y="197" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">(Recebedora)</text>
  <text x="1105" y="218" fill="#c9d1d9" font-size="11" text-anchor="middle">Credita o valor na conta</text>
  <text x="1105" y="234" fill="#c9d1d9" font-size="11" text-anchor="middle">do destinatário</text>
  <text x="1105" y="252" fill="#8b949e" font-size="10.5" text-anchor="middle">também participa do Open Finance ↓</text>

  <!-- Box 5: Cliente destinatário -->
  <rect x="1290" y="150" width="170" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="1375" y="182" fill="#e6edf3" font-size="13.5" font-weight="bold" text-anchor="middle">Cliente</text>
  <text x="1375" y="200" fill="#e6edf3" font-size="13.5" font-weight="bold" text-anchor="middle">destinatário</text>
  <text x="1375" y="228" fill="#8b949e" font-size="10.5" text-anchor="middle">recebe o crédito</text>
  <text x="1375" y="243" fill="#8b949e" font-size="10.5" text-anchor="middle">e a notificação</text>

  <!-- Setas de fluxo -->
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <line x1="270" y1="205" x2="322" y2="205"/>
    <line x1="580" y1="205" x2="632" y2="205"/>
    <line x1="920" y1="205" x2="972" y2="205"/>
    <line x1="1230" y1="205" x2="1282" y2="205"/>
  </g>
  <g fill="#8b949e">
    <polygon points="322,205 310,199 310,211"/>
    <polygon points="632,205 620,199 620,211"/>
    <polygon points="972,205 960,199 960,211"/>
    <polygon points="1282,205 1270,199 1270,211"/>
  </g>
  <text x="296" y="192" fill="#c9d1d9" font-size="9.5" text-anchor="middle">mensagem</text>
  <text x="296" y="228" fill="#c9d1d9" font-size="9.5" text-anchor="middle">Pix</text>
  <text x="606" y="192" fill="#c9d1d9" font-size="9.5" text-anchor="middle">consulta</text>
  <text x="606" y="228" fill="#c9d1d9" font-size="9.5" text-anchor="middle">DICT</text>
  <text x="946" y="192" fill="#c9d1d9" font-size="9.5" text-anchor="middle">crédito</text>
  <text x="946" y="228" fill="#c9d1d9" font-size="9.5" text-anchor="middle">liquidado</text>
  <text x="1256" y="192" fill="#c9d1d9" font-size="9.5" text-anchor="middle">aviso</text>
  <text x="1256" y="228" fill="#c9d1d9" font-size="9.5" text-anchor="middle">de crédito</text>

  <!-- Conectores tracejados para a camada Open Finance -->
  <line x1="455" y1="260" x2="375" y2="430" stroke="#8b949e" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="1105" y1="260" x2="1125" y2="430" stroke="#8b949e" stroke-width="1.3" stroke-dasharray="4,3"/>

  <!-- ================= CAMADA OPEN FINANCE (y 430-650) ================= -->
  <rect x="200" y="430" width="1100" height="220" rx="10" fill="#1c2128" stroke="#a371f7" stroke-width="2.5"/>
  <text x="225" y="455" fill="#a371f7" font-size="14.5" font-weight="bold">Camada Open Finance — APIs de dados entre instituições participantes</text>
  <text x="225" y="474" fill="#8b949e" font-size="11">128 a 154 milhões de consentimentos ativos (jan.–fev./2026); mais de 4,4 bilhões de comunicações semanais</text>

  <!-- Nós das instituições na malha de API -->
  <rect x="280" y="490" width="190" height="55" rx="7" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="375" y="513" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">Instituição A</text>
  <text x="375" y="530" fill="#8b949e" font-size="10" text-anchor="middle">(mesma Enviadora)</text>

  <rect x="1030" y="490" width="190" height="55" rx="7" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="1125" y="513" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">Instituição B</text>
  <text x="1125" y="530" fill="#8b949e" font-size="10" text-anchor="middle">(mesma Recebedora)</text>

  <rect x="280" y="580" width="190" height="55" rx="7" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="375" y="603" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">Instituição C</text>
  <text x="375" y="620" fill="#8b949e" font-size="10" text-anchor="middle">outra participante</text>

  <rect x="1030" y="580" width="190" height="55" rx="7" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
  <text x="1125" y="603" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">Instituição D</text>
  <text x="1125" y="620" fill="#8b949e" font-size="10" text-anchor="middle">outra participante</text>

  <rect x="655" y="580" width="190" height="55" rx="7" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="750" y="603" fill="#3fb950" font-size="12" font-weight="bold" text-anchor="middle">Consentimento</text>
  <text x="750" y="620" fill="#8b949e" font-size="10" text-anchor="middle">do titular dos dados</text>

  <!-- Malha de chamadas de API (tracejado azul) -->
  <g stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="3,3" fill="none">
    <line x1="470" y1="517" x2="1030" y2="517"/>
    <line x1="470" y1="607" x2="655" y2="607"/>
    <line x1="845" y1="607" x2="1030" y2="607"/>
    <line x1="375" y1="545" x2="375" y2="580"/>
    <line x1="1125" y1="545" x2="1125" y2="580"/>
    <line x1="470" y1="500" x2="750" y2="580"/>
    <line x1="1030" y1="500" x2="750" y2="580"/>
  </g>

  <!-- ================= VETORES DE ATAQUE (numerados, vermelho) ================= -->
  <circle cx="262" cy="158" r="15" fill="#f85149" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="262" y="163" fill="#0d1117" font-size="14" font-weight="bold" text-anchor="middle">1</text>

  <circle cx="262" cy="252" r="15" fill="#f85149" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="262" y="257" fill="#0d1117" font-size="14" font-weight="bold" text-anchor="middle">2</text>

  <circle cx="572" cy="158" r="15" fill="#f85149" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="572" y="163" fill="#0d1117" font-size="14" font-weight="bold" text-anchor="middle">3</text>

  <circle cx="700" cy="518" r="15" fill="#f85149" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="700" y="523" fill="#0d1117" font-size="14" font-weight="bold" text-anchor="middle">4</text>

  <circle cx="750" cy="565" r="15" fill="#f85149" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="750" y="570" fill="#0d1117" font-size="14" font-weight="bold" text-anchor="middle">5</text>

  <!-- ================= LEGENDA ================= -->
  <line x1="40" y1="680" x2="1460" y2="680" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="702" fill="#e6edf3" font-size="13" font-weight="bold">Vetores de ataque anotados</text>

  <circle cx="55" cy="722" r="10" fill="#f85149"/>
  <text x="55" y="726" fill="#0d1117" font-size="10.5" font-weight="bold" text-anchor="middle">1</text>
  <text x="75" y="726" fill="#c9d1d9" font-size="11.5">Engenharia social / golpe da "mão fantasma" — vítima induzida a autorizar Pix fraudulento por telefone/WhatsApp</text>

  <circle cx="55" cy="748" r="10" fill="#f85149"/>
  <text x="55" y="752" fill="#0d1117" font-size="10.5" font-weight="bold" text-anchor="middle">2</text>
  <text x="75" y="752" fill="#c9d1d9" font-size="11.5">Malware bancário no aplicativo — captura de credenciais, tokens de sessão ou sobreposição de tela (overlay)</text>

  <circle cx="55" cy="774" r="10" fill="#f85149"/>
  <text x="55" y="778" fill="#0d1117" font-size="10.5" font-weight="bold" text-anchor="middle">3</text>
  <text x="75" y="778" fill="#c9d1d9" font-size="11.5">Credential stuffing — testes automatizados de credenciais vazadas contra o login da instituição participante</text>

  <circle cx="800" cy="722" r="10" fill="#f85149"/>
  <text x="800" y="726" fill="#0d1117" font-size="10.5" font-weight="bold" text-anchor="middle">4</text>
  <text x="820" y="726" fill="#c9d1d9" font-size="11.5">Abuso de API de Open Finance — exploração de integração mal protegida entre instituições participantes</text>

  <circle cx="800" cy="748" r="10" fill="#f85149"/>
  <text x="800" y="752" fill="#0d1117" font-size="10.5" font-weight="bold" text-anchor="middle">5</text>
  <text x="820" y="752" fill="#c9d1d9" font-size="11.5">Consentimento fraudulento — criação de consentimento híbrido no Open Finance sem autorização real do titular</text>

  <line x1="40" y1="800" x2="1460" y2="800" stroke="#30363d" stroke-width="1"/>
  <circle cx="55" cy="822" r="7" fill="#58a6ff"/>
  <text x="70" y="827" fill="#8b949e" font-size="11.5">Instituição participante / infraestrutura do Banco Central</text>
  <circle cx="480" cy="822" r="7" fill="#a371f7"/>
  <text x="495" y="827" fill="#8b949e" font-size="11.5">Camada Open Finance (categoria especial)</text>
  <circle cx="880" cy="822" r="7" fill="#f85149"/>
  <text x="895" y="827" fill="#8b949e" font-size="11.5">Vetor de ataque</text>

  <text x="40" y="860" fill="#8b949e" font-size="12">Fluxo lógico simplificado; não representa a topologia física real do SPI/DICT. Ver capítulo 02 — Setor Financeiro, seção "Fontes".</text>
</svg>
