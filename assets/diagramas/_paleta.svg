  <rect x="440" y="664" width="24" height="48" rx="4" fill="#d29922" stroke="#30363d" stroke-width="2"/>
  <text x="474" y="682" fill="#8b949e" font-size="12" font-family="Consolas, Menlo, monospace">tom 2</text>
  <text x="474" y="700" fill="#8b949e" font-size="12" font-family="Consolas, Menlo, monospace">#d29922</text>

  <!-- 12. Roxo -->
  <rect x="30" y="720" width="48" height="48" rx="6" fill="#a371f7" stroke="#30363d" stroke-width="2"/>
  <text x="100" y="738" fill="#e6edf3" font-size="15" font-weight="bold">Roxo (destaque)</text>
  <text x="100" y="758" fill="#8b949e" font-size="13" font-family="Consolas, Menlo, monospace">#a371f7</text>

