  <text x="100" y="310" fill="#8b949e" font-size="13" font-family="Consolas, Menlo, monospace">#30363d</text>

  <!-- 5. Texto titulo -->
  <rect x="30" y="328" width="48" height="48" rx="6" fill="#e6edf3" stroke="#30363d" stroke-width="2"/>
  <text x="100" y="346" fill="#e6edf3" font-size="15" font-weight="bold">Texto — titulo</text>
  <text x="100" y="366" fill="#8b949e" font-size="13" font-family="Consolas, Menlo, monospace">#e6edf3</text>

  <!-- 6. Texto corpo -->
  <rect x="30" y="384" width="48" height="48" rx="6" fill="#c9d1d9" stroke="#30363d" stroke-width="2"/>
