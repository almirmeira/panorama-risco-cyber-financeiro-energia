<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 780" width="620" height="780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="780" fill="#0d1117"/>

  <text x="30" y="42" fill="#e6edf3" font-size="22" font-weight="bold">Paleta canonica — Panorama de Risco Cyber</text>
  <text x="30" y="66" fill="#8b949e" font-size="13">GitHub dark dimmed · referencia viva para todos os SVGs do repositorio</text>

  <line x1="30" y1="82" x2="590" y2="82" stroke="#30363d" stroke-width="1"/>

  <!-- Row template: swatch 48x48 at x=30, label group starting x=100 -->

  <!-- 1. Fundo base -->
  <rect x="30" y="104" width="48" height="48" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
