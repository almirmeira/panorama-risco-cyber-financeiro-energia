  <!-- 7. Texto secundario -->
  <rect x="30" y="440" width="48" height="48" rx="6" fill="#8b949e" stroke="#30363d" stroke-width="2"/>
  <text x="100" y="458" fill="#e6edf3" font-size="15" font-weight="bold">Texto — secundario</text>
  <text x="100" y="478" fill="#8b949e" font-size="13" font-family="Consolas, Menlo, monospace">#8b949e</text>

  <!-- 8. Azul -->
  <rect x="30" y="496" width="48" height="48" rx="6" fill="#58a6ff" stroke="#30363d" stroke-width="2"/>
