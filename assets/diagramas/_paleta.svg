  <text x="100" y="142" fill="#8b949e" font-size="13" font-family="Consolas, Menlo, monospace">#0d1117</text>

  <!-- 2. Fundo painel -->
  <rect x="30" y="160" width="48" height="48" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="100" y="178" fill="#e6edf3" font-size="15" font-weight="bold">Fundo painel</text>
  <text x="100" y="198" fill="#8b949e" font-size="13" font-family="Consolas, Menlo, monospace">#161b22</text>

  <!-- 3. Fundo cartao -->
