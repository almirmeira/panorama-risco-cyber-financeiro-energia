<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1500" height="900" fill="#0d1117"/>

  <!-- Título -->
  <text x="40" y="42" fill="#e6edf3" font-size="24" font-weight="bold">Mapa Regulatório — Cibersegurança OT do Setor Elétrico Brasileiro (2019–2026)</text>
  <text x="40" y="66" fill="#8b949e" font-size="13.5">Linha do tempo das camadas de obrigação e referência técnica que incidem sobre agentes do setor elétrico e sobre o ONS</text>
  <line x1="40" y1="82" x2="1460" y2="82" stroke="#30363d" stroke-width="1"/>

  <!-- Eixo horizontal -->
  <line x1="80" y1="340" x2="1420" y2="340" stroke="#8b949e" stroke-width="2"/>
  <polygon points="1420,340 1408,334 1408,346" fill="#8b949e"/>

  <!-- Faixa de vigência do ARCiber (RN 964/2021 → hoje) -->
  <rect x="620" y="356" width="770" height="16" rx="6" fill="#3fb950" fill-opacity="0.28" stroke="#3fb950" stroke-width="1"/>
  <text x="1005" y="368" fill="#3fb950" font-size="10" font-weight="bold" text-anchor="middle">ARCiber (RN ANEEL nº 964/2021) — em vigor desde 1º/7/2022</text>

  <!-- ============ MARCO 1 — dez/2019, ONS propõe Procedimento de Rede (abaixo) ============ -->
  <line x1="100" y1="340" x2="100" y2="390" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="100" cy="340" r="8" fill="#58a6ff" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="15" y="454" width="200" height="150" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="115" y="478" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">dez/2019</text>
  <text x="115" y="500" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">ONS propõe</text>
  <text x="115" y="516" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">Procedimento de Rede</text>
  <text x="115" y="538" fill="#c9d1d9" font-size="10.5" text-anchor="middle">Submódulo de segurança</text>
  <text x="115" y="553" fill="#c9d1d9" font-size="10.5" text-anchor="middle">cibernética para o ARCiber</text>
  <text x="115" y="575" fill="#e3b341" font-size="11.5" font-weight="bold" text-anchor="middle">Exige: 3 ondas (18/27/36 meses)</text>
  <text x="115" y="591" fill="#8b949e" font-size="10" text-anchor="middle">Encaminhado à ANEEL para aprovação</text>
  <text x="115" y="365" fill="#8b949e" font-size="12" text-anchor="middle">2019</text>

  <!-- ============ MARCO 2 — 2021, Resolução CNPE nº 24/2021 (acima) ============ -->
  <line x1="360" y1="340" x2="360" y2="290" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="360" cy="340" r="8" fill="#58a6ff" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="265" y="160" width="200" height="130" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="365" y="184" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">2021</text>
  <text x="365" y="206" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">Resolução CNPE nº 24</text>
  <text x="365" y="226" fill="#c9d1d9" font-size="10.5" text-anchor="middle">Conselho Nacional de Política</text>
  <text x="365" y="241" fill="#c9d1d9" font-size="10.5" text-anchor="middle">Energética</text>
  <text x="365" y="263" fill="#e3b341" font-size="11.5" font-weight="bold" text-anchor="middle">Exige: coordenação setorial</text>
  <text x="365" y="279" fill="#8b949e" font-size="10" text-anchor="middle">Atribui à ANEEL a resposta a incidentes</text>
  <text x="365" y="365" fill="#8b949e" font-size="12" text-anchor="middle">2021</text>

  <!-- ============ MARCO 3 — 14/12/2021 → 1/7/2022, RN ANEEL nº 964/2021 — ARCiber (abaixo, destaque) ============ -->
  <line x1="620" y1="340" x2="620" y2="390" stroke="#f85149" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="620" cy="340" r="9" fill="#f85149" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="518" y="454" width="204" height="160" rx="8" fill="#161b22" stroke="#f85149" stroke-width="3"/>
  <text x="620" y="480" fill="#f85149" font-size="14" font-weight="bold" text-anchor="middle">14/12/2021 → 1/7/2022</text>
  <text x="620" y="500" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">RN ANEEL nº 964/2021</text>
  <text x="620" y="518" fill="#c9d1d9" font-size="10.5" text-anchor="middle">Marco regulatório central de</text>
  <text x="620" y="533" fill="#c9d1d9" font-size="10.5" text-anchor="middle">cibersegurança do setor elétrico</text>
  <text x="620" y="555" fill="#f85149" font-size="11.5" font-weight="bold" text-anchor="middle">Exige: política de segurança</text>
  <text x="620" y="570" fill="#f85149" font-size="11.5" font-weight="bold" text-anchor="middle">cibernética + define o ARCiber</text>
  <text x="620" y="590" fill="#8b949e" font-size="10" text-anchor="middle">Concessionárias, permissionárias,</text>
  <text x="620" y="604" fill="#8b949e" font-size="10" text-anchor="middle">autorizadas e o próprio ONS</text>
  <text x="620" y="365" fill="#8b949e" font-size="12" text-anchor="middle">2021/2022</text>

  <!-- ============ MARCO 4 — referência técnica internacional, IEC 62443 (acima, roxo) ============ -->
  <line x1="880" y1="340" x2="880" y2="290" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="880" cy="340" r="8" fill="#a371f7" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="778" y="140" width="204" height="150" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="880" y="164" fill="#a371f7" font-size="13" font-weight="bold" text-anchor="middle">Referência técnica</text>
  <text x="880" y="184" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">ISA/IEC 62443</text>
  <text x="880" y="204" fill="#c9d1d9" font-size="10.5" text-anchor="middle">Zonas, conduítes e Níveis de</text>
  <text x="880" y="219" fill="#c9d1d9" font-size="10.5" text-anchor="middle">Segurança (SL 1–4) para IACS</text>
  <text x="880" y="241" fill="#f85149" font-size="11.5" font-weight="bold" text-anchor="middle">Não é norma brasileira</text>
  <text x="880" y="257" fill="#8b949e" font-size="10" text-anchor="middle">Referência técnica internacional</text>
  <text x="880" y="272" fill="#8b949e" font-size="10" text-anchor="middle">usada para operacionalizar a RN 964</text>
  <text x="880" y="365" fill="#8b949e" font-size="12" text-anchor="middle">Transversal</text>

  <!-- ============ MARCO 5 — 17/2/2025 → 30/6/2025, Despacho ANEEL nº 427/2025 (abaixo) ============ -->
  <line x1="1140" y1="340" x2="1140" y2="390" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="1140" cy="340" r="8" fill="#e3b341" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="1038" y="454" width="204" height="150" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="1140" y="478" fill="#e3b341" font-size="13.5" font-weight="bold" text-anchor="middle">17/2/2025 → 30/6/2025</text>
  <text x="1140" y="500" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">Despacho ANEEL nº 427</text>
  <text x="1140" y="518" fill="#c9d1d9" font-size="10.5" text-anchor="middle">1ª fiscalização concreta da</text>
  <text x="1140" y="533" fill="#c9d1d9" font-size="10.5" text-anchor="middle">RN nº 964/2021</text>
  <text x="1140" y="555" fill="#f85149" font-size="11.5" font-weight="bold" text-anchor="middle">Exige: envio de informações</text>
  <text x="1140" y="570" fill="#f85149" font-size="11.5" font-weight="bold" text-anchor="middle">sobre a política implementada</text>
  <text x="1140" y="590" fill="#8b949e" font-size="10" text-anchor="middle">Mais de 3 anos após a RN 964 entrar</text>
  <text x="1140" y="604" fill="#8b949e" font-size="10" text-anchor="middle">em vigor</text>
  <text x="1140" y="365" fill="#8b949e" font-size="12" text-anchor="middle">2025</text>

  <!-- ============ MARCO 6 — 2026, lacuna: submódulo ONS ainda sem número/vigência final (acima, alerta) ============ -->
  <line x1="1390" y1="340" x2="1390" y2="290" stroke="#f85149" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="1390" cy="340" r="9" fill="#f85149" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="1288" y="140" width="204" height="150" rx="8" fill="#161b22" stroke="#f85149" stroke-width="3"/>
  <text x="1390" y="164" fill="#f85149" font-size="13.5" font-weight="bold" text-anchor="middle">2026 — lacuna</text>
  <text x="1390" y="186" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">Submódulo ONS ainda</text>
  <text x="1390" y="202" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">sem número/vigência final</text>
  <text x="1390" y="224" fill="#c9d1d9" font-size="10.5" text-anchor="middle">Camada operacional (ONS)</text>
  <text x="1390" y="239" fill="#c9d1d9" font-size="10.5" text-anchor="middle">segue em consolidação</text>
  <text x="1390" y="261" fill="#f85149" font-size="11.5" font-weight="bold" text-anchor="middle">Não confirmado nesta pesquisa</text>
  <text x="1390" y="277" fill="#8b949e" font-size="10" text-anchor="middle">Verificar diretamente em ons.org.br</text>
  <text x="1390" y="365" fill="#8b949e" font-size="12" text-anchor="middle">2026</text>

  <!-- Rodapé / legenda -->
  <line x1="40" y1="630" x2="1460" y2="630" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="654" fill="#e6edf3" font-size="13" font-weight="bold">Legenda</text>
  <circle cx="60" cy="676" r="7" fill="#58a6ff"/>
  <text x="75" y="681" fill="#8b949e" font-size="12">Marco institucional / de coordenação (não é, por si só, obrigação técnica direta)</text>
  <circle cx="700" cy="676" r="7" fill="#e3b341"/>
  <text x="715" y="681" fill="#8b949e" font-size="12">Obrigação regulatória específica do setor elétrico</text>
  <circle cx="60" cy="700" r="7" fill="#a371f7"/>
  <text x="75" y="705" fill="#8b949e" font-size="12">Referência técnica internacional (não é lei brasileira)</text>
  <circle cx="700" cy="700" r="7" fill="#f85149"/>
  <text x="715" y="705" fill="#8b949e" font-size="12">Marco regulatório central / alerta de lacuna não confirmada</text>

  <text x="40" y="734" fill="#8b949e" font-size="12">Espaçamento ilustrativo (não proporcional a meses-calendário). O número final e a data de vigência do submódulo de cibersegurança dos Procedimentos de Rede do ONS não foram</text>
  <text x="40" y="752" fill="#8b949e" font-size="12">confirmados nesta pesquisa (proposta original de dez/2019, cronograma de 3 ondas de 18/27/36 meses) — recomenda-se verificação direta em ons.org.br/ProcedimentosDeRede.</text>
  <text x="40" y="774" fill="#8b949e" font-size="12">Fontes de cada marco: ver seção "Fontes" do capítulo 03 — Setor Energia (README.md).</text>
</svg>
