<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 900" width="1560" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1560" height="900" fill="#0d1117"/>

  <!-- Título -->
  <text x="40" y="42" fill="#e6edf3" font-size="23" font-weight="bold">Kill Chain de Intrusão × MITRE ATT&amp;CK — Trilha TI e Extensão ATT&amp;CK for ICS (Energia/OT)</text>
  <text x="40" y="66" fill="#8b949e" font-size="13">Fases comuns aos dois setores (MITRE ATT&amp;CK Enterprise v19.1) e, para energia, a bifurcação exclusiva no ATT&amp;CK for ICS</text>
  <line x1="40" y1="82" x2="1520" y2="82" stroke="#30363d" stroke-width="1"/>

  <!-- Rótulo de trilha (esquerda, rotacionado) -->
  <text x="24" y="170" fill="#58a6ff" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 24 170)">TRILHA TI — ATT&amp;CK ENTERPRISE v19.1</text>

  <!-- ================= ROW 1 — Kill Chain / ATT&CK Enterprise (8 fases) ================= -->
  <!-- Box 0 — Reconhecimento -->
  <rect x="70" y="110" width="150" height="120" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="145" y="136" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">Reconhecimento</text>
  <text x="145" y="154" fill="#58a6ff" font-size="10.5" text-anchor="middle">TA0043</text>
  <text x="145" y="178" fill="#c9d1d9" font-size="10" text-anchor="middle">OSINT, varredura</text>
  <text x="145" y="192" fill="#c9d1d9" font-size="10" text-anchor="middle">de alvos e ativos</text>

  <!-- Arrow 0->1 -->
  <line x1="220" y1="170" x2="230" y2="170" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="233,170 224,165 224,175" fill="#58a6ff"/>

  <!-- Box 1 — Acesso Inicial -->
  <rect x="233" y="110" width="150" height="120" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="308" y="136" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">Acesso Inicial</text>
  <text x="308" y="154" fill="#58a6ff" font-size="10.5" text-anchor="middle">TA0001</text>
  <text x="308" y="178" fill="#c9d1d9" font-size="10" text-anchor="middle">Phishing, exploração</text>
  <text x="308" y="192" fill="#c9d1d9" font-size="10" text-anchor="middle">de vulnerabilidade</text>

  <!-- Arrow 1->2 -->
  <line x1="383" y1="170" x2="393" y2="170" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="396,170 387,165 387,175" fill="#58a6ff"/>

  <!-- Box 2 — Execução -->
  <rect x="396" y="110" width="150" height="120" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="471" y="136" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">Execução</text>
  <text x="471" y="154" fill="#58a6ff" font-size="10.5" text-anchor="middle">TA0002</text>
  <text x="471" y="178" fill="#c9d1d9" font-size="10" text-anchor="middle">Payload roda no</text>
  <text x="471" y="192" fill="#c9d1d9" font-size="10" text-anchor="middle">sistema-alvo</text>

  <!-- Arrow 2->3 -->
  <line x1="546" y1="170" x2="556" y2="170" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="559,170 550,165 550,175" fill="#58a6ff"/>

  <!-- Box 3 — Persistência -->
  <rect x="559" y="110" width="150" height="120" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="634" y="136" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">Persistência</text>
  <text x="634" y="154" fill="#58a6ff" font-size="10.5" text-anchor="middle">TA0003</text>
  <text x="634" y="178" fill="#c9d1d9" font-size="10" text-anchor="middle">Mantém acesso</text>
  <text x="634" y="192" fill="#c9d1d9" font-size="10" text-anchor="middle">entre reinícios</text>

  <!-- Arrow 3->4 -->
  <line x1="709" y1="170" x2="719" y2="170" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="722,170 713,165 713,175" fill="#58a6ff"/>

  <!-- Box 4 — Escalonamento de Privilégio -->
  <rect x="722" y="110" width="150" height="120" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="797" y="130" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">Escalonamento</text>
  <text x="797" y="146" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">de Privilégio</text>
  <text x="797" y="164" fill="#58a6ff" font-size="10.5" text-anchor="middle">TA0004</text>
  <text x="797" y="186" fill="#c9d1d9" font-size="10" text-anchor="middle">Eleva permissões</text>
  <text x="797" y="200" fill="#c9d1d9" font-size="10" text-anchor="middle">no host</text>

  <!-- Arrow 4->5 -->
  <line x1="872" y1="170" x2="882" y2="170" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="885,170 876,165 876,175" fill="#58a6ff"/>

  <!-- Box 5 — Movimento Lateral -->
  <rect x="885" y="110" width="150" height="120" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="960" y="130" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">Movimento</text>
  <text x="960" y="146" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">Lateral</text>
  <text x="960" y="164" fill="#58a6ff" font-size="10.5" text-anchor="middle">TA0008</text>
  <text x="960" y="186" fill="#c9d1d9" font-size="10" text-anchor="middle">Pivô entre hosts</text>
  <text x="960" y="200" fill="#c9d1d9" font-size="10" text-anchor="middle">e redes/segmentos</text>

  <!-- Arrow 5->6 -->
  <line x1="1035" y1="170" x2="1045" y2="170" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="1048,170 1039,165 1039,175" fill="#58a6ff"/>

  <!-- Box 6 — C2 -->
  <rect x="1048" y="110" width="150" height="120" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="1123" y="136" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">C2</text>
  <text x="1123" y="154" fill="#58a6ff" font-size="10.5" text-anchor="middle">TA0011</text>
  <text x="1123" y="178" fill="#c9d1d9" font-size="10" text-anchor="middle">Canal de comando</text>
  <text x="1123" y="192" fill="#c9d1d9" font-size="10" text-anchor="middle">e controle remoto</text>

  <!-- Arrow 6->7 -->
  <line x1="1198" y1="170" x2="1208" y2="170" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="1211,170 1202,165 1202,175" fill="#58a6ff"/>

  <!-- Box 7 — Ação/Impacto -->
  <rect x="1211" y="110" width="150" height="120" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="3"/>
  <text x="1286" y="136" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">Ação/Impacto</text>
  <text x="1286" y="154" fill="#58a6ff" font-size="10.5" text-anchor="middle">TA0040</text>
  <text x="1286" y="178" fill="#c9d1d9" font-size="10" text-anchor="middle">Objetivo final</text>
  <text x="1286" y="192" fill="#c9d1d9" font-size="10" text-anchor="middle">do atacante</text>
  <text x="1286" y="215" fill="#8b949e" font-size="9.5" text-anchor="middle">[3][4]</text>

  <!-- ================= BIFURCAÇÃO POR SETOR ================= -->
  <line x1="1286" y1="230" x2="1286" y2="260" stroke="#8b949e" stroke-width="2"/>
  <circle cx="1286" cy="264" r="7" fill="#0d1117" stroke="#8b949e" stroke-width="2"/>
  <text x="1286" y="286" fill="#8b949e" font-size="11" font-style="italic" text-anchor="middle">bifurcação por setor</text>

  <!-- Ramo Financeiro (diagonal, azul) -->
  <line x1="1279" y1="264" x2="960" y2="330" stroke="#58a6ff" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="960,330 970,326 968,336" fill="#58a6ff"/>

  <rect x="770" y="330" width="330" height="90" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="935" y="356" fill="#58a6ff" font-size="14" font-weight="bold" text-anchor="middle">Setor Financeiro</text>
  <text x="935" y="378" fill="#c9d1d9" font-size="11.5" text-anchor="middle">Impacto/extorsão via ecossistema RaaS —</text>
  <text x="935" y="396" fill="#c9d1d9" font-size="11.5" text-anchor="middle">fraude, vazamento, resgate (cap. 02)</text>

  <!-- Ramo Energia (vertical, transita para âmbar) -->
  <line x1="1293" y1="264" x2="1293" y2="340" stroke="#e3b341" stroke-width="2.5"/>
  <polygon points="1293,343 1288,333 1298,333" fill="#e3b341"/>
  <text x="1310" y="305" fill="#e3b341" font-size="11" font-style="italic">setor Energia →</text>

  <!-- ================= PAINEL — Extensão ATT&CK for ICS (Energia/OT) ================= -->
  <rect x="1080" y="345" width="420" height="530" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="1290" y="374" fill="#e3b341" font-size="15" font-weight="bold" text-anchor="middle">Energia — Extensão ATT&amp;CK for ICS</text>
  <text x="1290" y="393" fill="#8b949e" font-size="10.5" text-anchor="middle">12 táticas / 107 técnicas — 2 exclusivas do domínio ICS [5][6]</text>
  <text x="1103" y="620" fill="#e3b341" font-size="11.5" font-weight="bold" text-anchor="middle" transform="rotate(-90 1103 620)">TRILHA OT/ICS — ATT&amp;CK FOR ICS</text>

  <!-- Box A — Impair Process Control -->
  <line x1="1290" y1="343" x2="1290" y2="415" stroke="#e3b341" stroke-width="2"/>
  <rect x="1145" y="418" width="290" height="105" rx="8" fill="#1c2128" stroke="#e3b341" stroke-width="2"/>
  <text x="1290" y="443" fill="#e6edf3" font-size="13.5" font-weight="bold" text-anchor="middle">Impair Process Control</text>
  <text x="1290" y="460" fill="#e3b341" font-size="10.5" text-anchor="middle">exclusiva ICS · 13 técnicas</text>
  <text x="1290" y="482" fill="#c9d1d9" font-size="10.5" text-anchor="middle">Manipula diretamente o</text>
  <text x="1290" y="497" fill="#c9d1d9" font-size="10.5" text-anchor="middle">processo físico controlado</text>
  <text x="1290" y="514" fill="#8b949e" font-size="9.5" text-anchor="middle">maior concentração da matriz ICS</text>

  <!-- Arrow A->B -->
  <line x1="1290" y1="523" x2="1290" y2="558" stroke="#e3b341" stroke-width="2"/>
  <polygon points="1290,561 1285,551 1295,551" fill="#e3b341"/>

  <!-- Box B — Inhibit Response Function -->
  <rect x="1145" y="564" width="290" height="105" rx="8" fill="#1c2128" stroke="#e3b341" stroke-width="2"/>
  <text x="1290" y="589" fill="#e6edf3" font-size="13.5" font-weight="bold" text-anchor="middle">Inhibit Response Function</text>
  <text x="1290" y="606" fill="#e3b341" font-size="10.5" text-anchor="middle">exclusiva do domínio ICS</text>
  <text x="1290" y="628" fill="#c9d1d9" font-size="10.5" text-anchor="middle">Impede que sistemas de proteção</text>
  <text x="1290" y="643" fill="#c9d1d9" font-size="10.5" text-anchor="middle">reajam a uma condição anômala</text>
  <text x="1290" y="660" fill="#8b949e" font-size="9.5" text-anchor="middle">usada em Industroyer/Industroyer2</text>

  <!-- Arrow B->C -->
  <line x1="1290" y1="669" x2="1290" y2="704" stroke="#f85149" stroke-width="2.5"/>
  <polygon points="1290,707 1284,695 1296,695" fill="#f85149"/>

  <!-- Box C — Impacto Físico (crítico, vermelho) -->
  <rect x="1145" y="710" width="290" height="120" rx="8" fill="#1c2128" stroke="#f85149" stroke-width="3"/>
  <text x="1290" y="738" fill="#f85149" font-size="14.5" font-weight="bold" text-anchor="middle">Impacto Físico</text>
  <text x="1290" y="760" fill="#c9d1d9" font-size="11" text-anchor="middle">Apagão, dano a equipamento,</text>
  <text x="1290" y="777" fill="#c9d1d9" font-size="11" text-anchor="middle">risco potencial à vida</text>
  <text x="1290" y="798" fill="#8b949e" font-size="9.5" text-anchor="middle">ex.: Industroyer (2016), Industroyer2 (2022)</text>
  <text x="1290" y="813" fill="#8b949e" font-size="9.5" text-anchor="middle">— já detalhados no capítulo 03</text>

  <!-- ================= LEGENDA ================= -->
  <rect x="40" y="820" width="16" height="16" rx="3" fill="#58a6ff"/>
  <text x="64" y="833" fill="#c9d1d9" font-size="12">Trilha TI — MITRE ATT&amp;CK Enterprise v19.1 (comum aos dois setores)</text>

  <rect x="40" y="848" width="16" height="16" rx="3" fill="#e3b341"/>
  <text x="64" y="861" fill="#c9d1d9" font-size="12">Trilha OT/ICS — MITRE ATT&amp;CK for ICS (exclusiva de Energia)</text>

  <rect x="40" y="876" width="16" height="16" rx="3" fill="#f85149"/>
  <text x="64" y="889" fill="#c9d1d9" font-size="12">Ponto de impacto físico crítico — sem equivalente no domínio Enterprise</text>

  <text x="1520" y="889" fill="#8b949e" font-size="10.5" text-anchor="end">Fontes: capítulo 05 — Atores e TTPs [3][4][5][6]</text>
</svg>
