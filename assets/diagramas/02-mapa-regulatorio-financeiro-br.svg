<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1500" height="900" fill="#0d1117"/>

  <!-- Título -->
  <text x="40" y="42" fill="#e6edf3" font-size="24" font-weight="bold">Mapa Regulatório — Setor Financeiro Brasileiro (2018–2026)</text>
  <text x="40" y="66" fill="#8b949e" font-size="13.5">Linha do tempo das obrigações que incidem sobre uma instituição financeira brasileira, com a exigência-chave de cada camada</text>
  <line x1="40" y1="82" x2="1460" y2="82" stroke="#30363d" stroke-width="1"/>

  <!-- Eixo horizontal -->
  <line x1="80" y1="340" x2="1420" y2="340" stroke="#8b949e" stroke-width="2"/>
  <polygon points="1420,340 1408,334 1408,346" fill="#8b949e"/>

  <!-- Faixa de vigência do Open Finance (2021 → 2026) -->
  <rect x="543.3" y="356" width="826.7" height="16" rx="6" fill="#a371f7" fill-opacity="0.28" stroke="#a371f7" stroke-width="1"/>
  <text x="956.7" y="368" fill="#a371f7" font-size="10" font-weight="bold" text-anchor="middle">Open Finance Brasil — fases de implementação em vigor</text>

  <!-- ============ MARCO 1 — 2018, LGPD sancionada (acima) ============ -->
  <line x1="130" y1="340" x2="130" y2="290" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="130" cy="340" r="8" fill="#58a6ff" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="35" y="150" width="190" height="140" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="130" y="176" fill="#58a6ff" font-size="15" font-weight="bold" text-anchor="middle">2018 → 2020</text>
  <text x="130" y="198" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">LGPD</text>
  <text x="130" y="216" fill="#c9d1d9" font-size="11" text-anchor="middle">Lei nº 13.709/2018,</text>
  <text x="130" y="232" fill="#c9d1d9" font-size="11" text-anchor="middle">em vigor desde 2020</text>
  <text x="130" y="254" fill="#e3b341" font-size="12" font-weight="bold" text-anchor="middle">Exige: Consentimento</text>
  <text x="130" y="272" fill="#8b949e" font-size="10.5" text-anchor="middle">Transversal a todos os setores</text>
  <text x="130" y="365" fill="#8b949e" font-size="12" text-anchor="middle">2018/2020</text>

  <!-- ============ MARCO 2 — nov/2020, Pix lançado (abaixo) ============ -->
  <line x1="336.7" y1="340" x2="336.7" y2="390" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="336.7" cy="340" r="8" fill="#58a6ff" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="241.7" y="454" width="190" height="140" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="336.7" y="480" fill="#58a6ff" font-size="15" font-weight="bold" text-anchor="middle">nov/2020</text>
  <text x="336.7" y="502" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">Pix</text>
  <text x="336.7" y="520" fill="#c9d1d9" font-size="11" text-anchor="middle">Sistema de pagamento</text>
  <text x="336.7" y="536" fill="#c9d1d9" font-size="11" text-anchor="middle">instantâneo do Banco Central</text>
  <text x="336.7" y="558" fill="#e3b341" font-size="12" font-weight="bold" text-anchor="middle">Exige: Instantaneidade</text>
  <text x="336.7" y="576" fill="#8b949e" font-size="10.5" text-anchor="middle">SPI + DICT (ver Figura 1)</text>
  <text x="336.7" y="365" fill="#8b949e" font-size="12" text-anchor="middle">2020</text>

  <!-- ============ MARCO 3 — 26/2/2021, CMN 4.893 + BCB 85 (acima) ============ -->
  <line x1="543.3" y1="340" x2="543.3" y2="290" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="543.3" cy="340" r="8" fill="#e3b341" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="448.3" y="140" width="190" height="150" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="543.3" y="164" fill="#e3b341" font-size="14" font-weight="bold" text-anchor="middle">26/2/2021</text>
  <text x="543.3" y="184" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">Res. CMN nº 4.893/2021</text>
  <text x="543.3" y="200" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">+ Res. BCB nº 85/2021</text>
  <text x="543.3" y="220" fill="#c9d1d9" font-size="10.5" text-anchor="middle">Bancos/cooperativas (CMN) e</text>
  <text x="543.3" y="235" fill="#c9d1d9" font-size="10.5" text-anchor="middle">instituições de pagamento (BCB)</text>
  <text x="543.3" y="260" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">Exige: Segurança cibernética</text>
  <text x="543.3" y="278" fill="#8b949e" font-size="10.5" text-anchor="middle">Política, IR, pentest, terceiros</text>
  <text x="543.3" y="365" fill="#8b949e" font-size="12" text-anchor="middle">2021</text>

  <!-- ============ MARCO 4 — 2021→, Open Finance Brasil (abaixo) ============ -->
  <line x1="750" y1="340" x2="750" y2="390" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="750" cy="340" r="8" fill="#a371f7" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="655" y="454" width="190" height="150" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="750" y="478" fill="#a371f7" font-size="14" font-weight="bold" text-anchor="middle">2021 → em curso</text>
  <text x="750" y="500" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">Open Finance Brasil</text>
  <text x="750" y="518" fill="#c9d1d9" font-size="10.5" text-anchor="middle">128–154 milhões de</text>
  <text x="750" y="533" fill="#c9d1d9" font-size="10.5" text-anchor="middle">consentimentos ativos (2026)</text>
  <text x="750" y="558" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">Exige: Compartilhamento</text>
  <text x="750" y="574" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">controlado</text>
  <text x="750" y="594" fill="#8b949e" font-size="10.5" text-anchor="middle">Gestão de consentimento e API</text>
  <text x="750" y="365" fill="#8b949e" font-size="12" text-anchor="middle">2021→</text>

  <!-- ============ MARCO 5 — 2025, Resolução Conjunta BCB/CMN nº 6 (acima) ============ -->
  <line x1="956.7" y1="340" x2="956.7" y2="290" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="956.7" cy="340" r="8" fill="#e3b341" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="861.7" y="140" width="190" height="150" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="956.7" y="164" fill="#e3b341" font-size="14" font-weight="bold" text-anchor="middle">2025</text>
  <text x="956.7" y="184" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">Res. Conjunta</text>
  <text x="956.7" y="200" fill="#e6edf3" font-size="12.5" font-weight="bold" text-anchor="middle">BCB/CMN nº 6</text>
  <text x="956.7" y="222" fill="#c9d1d9" font-size="10.5" text-anchor="middle">MED aprimorado; combate à</text>
  <text x="956.7" y="237" fill="#c9d1d9" font-size="10.5" text-anchor="middle">fraude de "devolução dupla"</text>
  <text x="956.7" y="260" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">Exige: Rastreabilidade</text>
  <text x="956.7" y="278" fill="#8b949e" font-size="10.5" text-anchor="middle">Compartilhamento de indícios de fraude</text>
  <text x="956.7" y="365" fill="#8b949e" font-size="12" text-anchor="middle">2025</text>

  <!-- ============ MARCO 6 — 2025, CMN 5.274 + BCB 538 (abaixo) ============ -->
  <line x1="1163.3" y1="340" x2="1163.3" y2="390" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="1163.3" cy="340" r="8" fill="#e3b341" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="1068.3" y="454" width="190" height="150" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="1163.3" y="478" fill="#e3b341" font-size="14" font-weight="bold" text-anchor="middle">2025</text>
  <text x="1163.3" y="498" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">Res. CMN nº 5.274/2025</text>
  <text x="1163.3" y="514" fill="#e6edf3" font-size="12" font-weight="bold" text-anchor="middle">+ Res. BCB nº 538/2025</text>
  <text x="1163.3" y="536" fill="#c9d1d9" font-size="10.5" text-anchor="middle">Atualiza CMN 4.893/2021 e</text>
  <text x="1163.3" y="551" fill="#c9d1d9" font-size="10.5" text-anchor="middle">BCB 85/2021</text>
  <text x="1163.3" y="574" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">Exige: Atualização</text>
  <text x="1163.3" y="592" fill="#8b949e" font-size="10.5" text-anchor="middle">Novo texto regulatório</text>
  <text x="1163.3" y="365" fill="#8b949e" font-size="12" text-anchor="middle">2025</text>

  <!-- ============ MARCO 7 — março/2026, Prazo final (acima, destaque crítico) ============ -->
  <line x1="1370" y1="340" x2="1370" y2="290" stroke="#f85149" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="1370" cy="340" r="9" fill="#f85149" stroke="#e6edf3" stroke-width="1.5"/>
  <rect x="1268" y="140" width="190" height="150" rx="8" fill="#161b22" stroke="#f85149" stroke-width="3"/>
  <text x="1363" y="164" fill="#f85149" font-size="14" font-weight="bold" text-anchor="middle">março/2026</text>
  <text x="1363" y="186" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">Prazo final de</text>
  <text x="1363" y="204" fill="#e6edf3" font-size="13" font-weight="bold" text-anchor="middle">adequação</text>
  <text x="1363" y="226" fill="#c9d1d9" font-size="10.5" text-anchor="middle">Fim do prazo para adequar-se</text>
  <text x="1363" y="241" fill="#c9d1d9" font-size="10.5" text-anchor="middle">a CMN 5.274/2025 e BCB 538/2025</text>
  <text x="1363" y="264" fill="#f85149" font-size="12.5" font-weight="bold" text-anchor="middle">Exige: Prazo limite</text>
  <text x="1363" y="365" fill="#8b949e" font-size="12" text-anchor="middle">mar/2026</text>

  <!-- Rodapé / legenda -->
  <line x1="40" y1="630" x2="1460" y2="630" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="654" fill="#e6edf3" font-size="13" font-weight="bold">Legenda</text>
  <circle cx="60" cy="676" r="7" fill="#58a6ff"/>
  <text x="75" y="681" fill="#8b949e" font-size="12">Marco de infraestrutura/proteção de dados transversal</text>
  <circle cx="460" cy="676" r="7" fill="#e3b341"/>
  <text x="475" y="681" fill="#8b949e" font-size="12">Obrigação regulatória específica do setor financeiro</text>
  <circle cx="860" cy="676" r="7" fill="#a371f7"/>
  <text x="875" y="681" fill="#8b949e" font-size="12">Open Finance (categoria especial)</text>
  <circle cx="1160" cy="676" r="7" fill="#f85149"/>
  <text x="1175" y="681" fill="#8b949e" font-size="12">Prazo crítico / deadline regulatório</text>

  <text x="40" y="710" fill="#8b949e" font-size="12">Espaçamento ilustrativo (não proporcional a meses-calendário). Nomes exatos das normas: Resolução CMN nº 4.893/2021 e Resolução BCB nº 85/2021 — não existe "Resolução BCB nº 4.893".</text>
  <text x="40" y="730" fill="#8b949e" font-size="12">Fontes de cada marco: ver seção "Fontes" do capítulo 02 — Setor Financeiro (README.md).</text>
</svg>
